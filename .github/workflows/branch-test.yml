# TEMPORARY. Runs the new self-contained runtime on macOS (and builds the VM guest on
# Linux) for the feat/self-contained-orchard branch, which the release workflow does
# not cover. Delete this file before merging.
name: Branch test (temporary)

on:
  push:
    branches: [feat/self-contained-orchard]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCHARD_REF: feat/self-contained-orchard

jobs:
  # The guest image and a complete initramfs (guest + Apple's daemon), made on Linux.
  guest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 61soldiers/orchard
          ref: ${{ env.ORCHARD_REF }}
          path: orchard
      - uses: actions/setup-go@v5
        with:
          go-version-file: orchard/go.mod
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs
      - name: Build the guest and assemble an initramfs holding the real daemon
        run: |
          cd orchard
          go run ./cmd/guestbuild -arch x86_64 -out ../guest
          go build -o ../guestbuild ./cmd/guestbuild
          cd ..
          curl -fsSL -o w.zip https://github.com/WorldObservationLog/wrapper/releases/download/wrapper.x86_64.latest/Wrapper.x86_64.latest.zip
          unzip -q w.zip -d wrapper
          ./guestbuild -initramfs guest/initramfs.cpio.gz -base guest/base.cpio.gz -rootfs wrapper/rootfs
          gunzip -k guest/data.img.gz
          ls -la guest
      - uses: actions/upload-artifact@v4
        with:
          name: guest
          path: guest

  # Orchard itself, on a Mac.
  orchard-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 61soldiers/orchard
          ref: ${{ env.ORCHARD_REF }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o orchard ./cmd/orchard && ls -la orchard

  # QEMU built for the Mac, then the real thing: boot the guest with Apple's daemon.
  qemu-macos:
    needs: guest
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guest
          path: guest
      - name: Build QEMU
        run: bash tool/qemu/build.sh macos qemu-out
      - name: Size
        run: |
          du -sh qemu-out qemu-out/*
          tar -czf qemu.tar.gz -C qemu-out . && ls -la qemu.tar.gz
          otool -L qemu-out/qemu-system-x86_64
      - name: It runs
        run: |
          qemu-out/qemu-system-x86_64 --version
          qemu-out/qemu-system-x86_64 -accel help
          qemu-out/qemu-system-x86_64 -L qemu-out/share -M help | grep -E "q35"
      - name: Boot the guest with Apple's daemon (software emulation)
        run: |
          set -u
          # The host pings the guest like Orchard does; without it the guest stops itself.
          ( while :; do echo ORCHARDPING; sleep 5; done ) | qemu-out/qemu-system-x86_64 -L qemu-out/share -machine q35 -m 1024 -smp 2 \
            -display none -monitor none -nodefaults -no-reboot \
            -kernel guest/vmlinuz -initrd guest/initramfs.cpio.gz \
            -append "console=ttyS0 quiet loglevel=3 panic=-1 rdinit=/init" \
            -drive if=none,id=d0,format=raw,file=guest/data.img -device virtio-blk-pci,drive=d0 \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0,romfile= \
            -chardev stdio,id=con,signal=off -serial chardev:con \
            -accel tcg -cpu Nehalem > boot.log 2>&1 &
          start=$SECONDS
          ok=0
          for i in $(seq 1 120); do
            if grep -q "Android presentation interface constructed" boot.log; then ok=1; break; fi
            sleep 2
          done
          echo "daemon initialised: $ok after $((SECONDS - start))s"
          pkill -f qemu-system-x86_64 || true
          echo "---- guest console"; head -40 boot.log
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.os }}
          path: |
            qemu.tar.gz
            boot.log
