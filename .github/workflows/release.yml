name: Release

on:
  push:
    branches: [main, dev, mvp]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # QEMU for macOS, one bundle per CPU: it has to be made on a Mac, and Apple
  # Silicon and Intel are different runners.
  qemu-macos:
    strategy:
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tool/package_qemu_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.os }}
          path: assets/qemu/darwin-*.tar.gz
          if-no-files-found: error

  # Version, build and bundle Orchard, pack the .elbx and publish the release.
  release:
    needs: qemu-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # package.json points the SDK at ../elbert-plugin-sdk (file:), so it has to
      # sit beside this checkout. actions/checkout can only write inside the
      # workspace, hence the move.
      - uses: actions/checkout@v4
        with:
          repository: evolvedmesh/elbert-plugin-sdk
          ref: ${{ vars.SDK_REF || 'main' }}
          path: .sdk

      - run: mv .sdk ../elbert-plugin-sdk

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orchard
          ref: ${{ vars.ORCHARD_SRC_REF || 'main' }}
          path: .orchard-src

      # QEMU for macOS, built above.
      - uses: actions/download-artifact@v4
        with:
          pattern: qemu-*
          path: assets/qemu
          merge-multiple: true

      # The Windows QEMU bundle and the VM guest are built here, on Linux.
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full e2fsprogs binutils

      - uses: oven-sh/setup-bun@v2

      # tool/build_orchard.sh compiles Orchard for each platform it ships.
      - uses: actions/setup-go@v5
        with:
          go-version-file: .orchard-src/go.mod

      - run: bun install --frozen-lockfile --cwd ../elbert-plugin-sdk
      - run: bun install --frozen-lockfile

      # Typecheck, tests, Biome lint/format and the manifest/template check.
      - run: bun run check

      - name: Run Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCHARD_SRC_DIR: ${{ github.workspace }}/.orchard-src
        run: bunx --bun semantic-release
