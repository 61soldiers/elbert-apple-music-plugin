name: Release

on:
  push:
    branches: [main, dev, mvp]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # QEMU for the platforms that run Apple's daemon in a VM: Windows and Apple-silicon
  # Macs, built from source with only what the guest needs (about 4 MB compressed
  # each). Linux uses user namespaces and needs none; Intel Macs aren't supported. The
  # result is cached on the build script, so a release that doesn't change it doesn't
  # rebuild it.
  qemu:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: windows-amd64, os: ubuntu-24.04, target: windows }
          - { id: darwin-arm64, os: macos-14, target: macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: tool/qemu/out/${{ matrix.id }}
          key: qemu-${{ matrix.id }}-${{ hashFiles('tool/qemu/build.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: bash tool/qemu/build.sh ${{ matrix.target }} tool/qemu/out/${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.id }}
          path: tool/qemu/out/${{ matrix.id }}
          if-no-files-found: error

  # Version, build the runtime packs, pack the .elbx and publish the release.
  release:
    needs: qemu
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # package.json points the SDK at ../elbert-plugin-sdk (file:), so it has to
      # sit beside this checkout. actions/checkout can only write inside the
      # workspace, hence the move.
      - uses: actions/checkout@v4
        with:
          repository: evolvedmesh/elbert-plugin-sdk
          ref: ${{ vars.SDK_REF || 'main' }}
          path: .sdk

      - run: mv .sdk ../elbert-plugin-sdk

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/orchard
          ref: ${{ vars.ORCHARD_SRC_REF || 'main' }}
          path: .orchard-src

      # tool/build_runtime.sh compiles Orchard for each platform it ships.
      - uses: actions/setup-go@v5
        with:
          go-version-file: .orchard-src/go.mod

      # The VM guest is built here, on Linux.
      - run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      # QEMU for every platform, built above.
      - uses: actions/download-artifact@v4
        with:
          pattern: qemu-*
          path: tool/qemu/out
      - run: |
          # artifacts unpack as tool/qemu/out/qemu-<id>/…; the build script wants <id>/
          cd tool/qemu/out && for d in qemu-*; do mv "$d" "${d#qemu-}"; done

      # The Android runtime pack is signed with one key for good: Android refuses to update
      # an app signed with another. Without the secret a release simply has no Android pack.
      - name: Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/android.jks" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile --cwd ../elbert-plugin-sdk
      - run: bun install --frozen-lockfile

      # Typecheck, tests, Biome lint/format and the manifest/template check.
      - run: bun run check

      - name: Run Semantic Release
        id: semrel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORCHARD_SRC_DIR: ${{ github.workspace }}/.orchard-src
          # The runner's own Android SDK and NDK build the Android runtime pack.
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'elbert' }}
        run: bunx --bun semantic-release
